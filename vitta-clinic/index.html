<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d5169">
  <title>Entrar | Medora</title>
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/normalizacao.css">
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/acesso.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-brand" aria-label="Medora">
      <p class="eyebrow">Medora</p>
      <h1>Inovação na gestão.<br>Humanidade no cuidado.</h1>
      <p>Organize sua clínica e acompanhe cada etapa do cuidado em um só lugar.</p>
      <div class="brand-decoration" aria-hidden="true">✳</div>
    </section>
    <section class="login-card">
      <img class="login-logo" src="assets/images/logo.png" alt="Medora" width="64" height="48">
      <p class="eyebrow">Bem-vindo(a) de volta</p>
      <h2>Acesse sua conta</h2>
      <p class="muted">Entre com seu e-mail e senha para continuar.</p>
      <form id="login-form" class="form-stack" novalidate>
        <label for="email">E-mail:</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="voce@clinica.com" required>
        <label for="password">Senha:</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        <a class="recovery-link" href="recuperar-senha.html">Esqueci minha senha</a>
        <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
        <button class="button button-primary button-wide" type="submit">Entrar na plataforma</button>
      </form>
    </section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/armazenamento.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/autenticacao.js"></script>
</body>
</html>
